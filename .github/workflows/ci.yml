name: Valorant MCP CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: valorant-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-image:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Derived from the repository rather than hardcoded. The image name was
      # pinned to ghcr.io/csoesports/... — a package owned by the CSOeSports
      # personal account. When these repos were transferred to the
      # CSO-Esports-Pty-Ltd organisation the packages stayed behind, and the
      # org-scoped GITHUB_TOKEN could no longer push to them, so every publish
      # failed with 403. Deriving the owner keeps this correct across future
      # transfers. GHCR requires lowercase, hence ${VAR,,}.
      - name: Resolve image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run python -m compileall src

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt

      - name: Smoke test tool registry
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          from unittest.mock import patch

          from valorant_mcp_server import http_server
          from valorant_mcp_server.server import mcp

          async def main():
              tools = await mcp.list_tools()
              resources = await mcp.list_resources()
              assert tools, "No MCP tools registered"
              tool_names = {tool.name for tool in tools}
              resource_uris = {str(resource.uri) for resource in resources}
              required_tools = {
                  "get_rank",
                  "get_rank_history",
                  "get_match",
                  "get_live_status",
                  "get_static_content",
                  "get_player_playtime",
                  "get_trial_readiness_score",
                  "compare_players",
                  "screen_candidates",
                  "get_account",
                  "get_premier_team",
                  "get_premier_leaderboard",
                  "get_stored_mmr_history",
                  "get_match_rounds_summary",
                  "get_match_round",
                  "get_match_events_compact",
                  "get_match_player_impact_summary",
                  "get_match_team_economy_summary",
                  "get_match_opening_duels",
                  "get_match_history",
                  "get_stored_matches",
                  "get_match_player_stats_compact",
                  "get_player_backfill_aggregate",
                  "get_bulk_player_backfill_aggregates",
                  "get_player_pools",
                  "get_player_analytics_bundle",
                  "get_leaderboard",
                  "get_esports_schedule",
              }
              assert required_tools <= tool_names, required_tools - tool_names
              assert "get_esports_games_data" not in tool_names
              assert len(tool_names) == 37, len(tool_names)
              assert "valorant://agents" in resource_uris
              print(f"Registered {len(tools)} MCP tools")

          asyncio.run(main())

          os.environ["MCP_HOST"] = "127.0.0.1"
          os.environ["MCP_PORT"] = "8123"
          with patch.object(http_server.mcp, "run") as run:
              http_server.main()
              run.assert_called_once_with(transport="streamable-http")
              assert http_server.mcp.settings.host == "127.0.0.1"
              assert http_server.mcp.settings.port == 8123
          PY
        env:
          HENRIK_API_KEY: ci-placeholder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image without publishing
        if: github.event_name != 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Build and publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
